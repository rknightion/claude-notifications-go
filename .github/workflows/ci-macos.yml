name: macOS CI

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on macOS (${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - go: '1.21'
            os: macos-15
          - go: '1.26'
            os: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Display Go version
        run: go version

      - name: Download dependencies
        run: just setup

      - name: Run go vet
        run: just vet

      - name: Run go fmt check
        run: just fmt-check

      - name: Run tests
        run: just test

      - name: Build binary
        run: just smoke

      - name: Check for system sounds
        run: |
          if [ -d "/System/Library/Sounds" ]; then
            echo "✓ System sounds directory found"
            find /System/Library/Sounds -maxdepth 1 -type f -name '*.aiff' -print | sed -n '1,3p'
          else
            echo "⚠ System sounds directory not found (expected on macOS)"
          fi

      - name: Run install.sh unit tests
        run: just test-install

      - name: Run install.sh E2E tests (offline + mock)
        run: just test-install-e2e

      - name: Run install.sh E2E diagnostics (real network)
        if: matrix.go == '1.26'
        run: just test-install-e2e --real-network
        timeout-minutes: 5
        continue-on-error: true

  swift-test:
    name: Swift notifier tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Run Swift tests
        run: just test-swift
