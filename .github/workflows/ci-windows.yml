name: Windows CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.58.0'

      - name: Display Go version
        run: go version

      - name: Download dependencies
        run: just setup

      - name: Run go vet
        run: just vet

      - name: Run go fmt check
        run: just fmt-check

      - name: Run tests
        run: just test

      - name: Build binary
        run: just smoke

      - name: Run install.sh unit tests
        run: just test-install

      - name: Run install.sh E2E tests (offline + mock)
        run: just test-install-e2e
